<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas de Turnos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
</head>

<body>

    <div class="container" id="home-view">

        <div class="tab-container">
            <button class="tab-button" id="btn-puma">Turno PUMA</button>
            <button class="tab-button" id="btn-ma">Turno Monte Alegre</button>
            <button class="tab-button" id="btn-comparar">Comparar</button>
            <div class="tab-slider"></div>
        </div>

        <div id="puma" class="tab-content">
            <h2 class="puma-header">Tabela PUMA</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Data</th><th>Dia</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>
                    </thead>
                    <tbody id="puma-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="monte-alegre" class="tab-content">
            <h2 class="ma-header">Tabela Monte Alegre</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Data</th><th>Dia</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>
                    </thead>
                    <tbody id="ma-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="comparar" class="tab-content">
            <h2 class="compare-header">Comparar Escalas</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Data</th><th>Dia</th><th>Fonte 1</th><th>Fonte 2</th></tr>
                    </thead>
                    <tbody id="compare-table-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="date-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Selecionar Data</h3>
            <div class="calendar-wrapper">
                <div class="calendar-header">
                    <button class="cal-nav-btn" onclick="changeCalendarPage(-1)">❮</button>
                    <div class="calendar-title-group">
                        <span id="calTitleMonth" class="cal-title-btn" onclick="openMonthPicker()">Mês</span>
                        <span id="calTitleYear" class="cal-title-btn" onclick="openYearPicker()">Ano</span>
                    </div>
                    <button class="cal-nav-btn" onclick="changeCalendarPage(1)">❯</button>
                </div>
                <div class="calendar-weekdays" id="calendarWeekdays">
                    <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
                </div>
                <div class="calendar-content" id="calendarGrid"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeDateModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmDate()">Ir</button>
            </div>
        </div>
    </div>

    <div id="compare-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Configurar Comparação</h3>

            <div class="modal-body" style="flex-direction: column;">
                <div style="background: #f5f5f5; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <div class="input-group" style="margin-bottom: 10px;">
                        <label>Tabela 1</label>
                        <select class="modal-select" id="compareTabela1" onchange="renderTableCompare()"></select>
                    </div>
                    <div class="input-group">
                        <label>Letra / Turma</label>
                        <select class="modal-select" id="compareLetra1" onchange="renderTableCompare()"></select>
                    </div>
                </div>

                <div style="background: #f5f5f5; padding: 10px; border-radius: 8px;">
                    <div class="input-group" style="margin-bottom: 10px;">
                        <label>Tabela 2</label>
                        <select class="modal-select" id="compareTabela2" onchange="renderTableCompare()"></select>
                    </div>
                    <div class="input-group">
                        <label>Letra / Turma</label>
                        <select class="modal-select" id="compareLetra2" onchange="renderTableCompare()"></select>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-confirm" onclick="closeCompareModal()" style="width: 100%;">Concluído</button>
            </div>
        </div>
    </div>

    <div id="fab-container">
        <button id="fab-compare" class="fab-mini" onclick="openCompareModal()" aria-label="Configurar Comparação" style="display: none;">
            🎚️
        </button>

        <button id="fab-today" class="fab-mini" onclick="goToToday()" aria-label="Ir para Hoje">
            📍
        </button>

        <button class="fab-main" onclick="openDateModal()" aria-label="Escolher Data">
            📅
        </button>
    </div>

    <div class="container" id="settings-view" style="display: none;">
        <h2 style="background-color: #455A64;">Configurações</h2>
        <div style="padding: 20px; text-align: center;">
            <p style="color: #666; margin-bottom: 20px;">Gerenciamento do Aplicativo</p>
            <button onclick="hardReset()" class="btn-reset">⚠️ Resetar e Atualizar App</button>
            <p style="font-size: 0.8rem; color: #999; margin-top: 30px;">Versão 2.0.1</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('home')">
            <span class="nav-icon">🏠</span><span class="nav-text">Início</span>
        </button>
        <button class="nav-item" onclick="switchView('settings')">
            <span class="nav-icon">⚙️</span><span class="nav-text">Ajustes</span>
        </button>
    </nav>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registrado!', reg))
                    .catch((err) => console.log('Falha ao registrar SW:', err));
            });
        }
    </script>
</body>
</html>
