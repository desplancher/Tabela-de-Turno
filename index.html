<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas de Turnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>

    <div class="container" id="home-view">
        <!-- Navegar entre as Tabelas -->
        <div class="tab-container">
            <button class="tab-button" onclick="openTab(event, 'puma')">Turno PUMA</button>
            <button class="tab-button" onclick="openTab(event, 'monte-alegre')">Turno Monte Alegre</button>
            <button class="tab-button" onclick="openTab(event, 'comparar')">Comparar</button>
        </div>


        <!-- Controles de Data -->
        <div class="controls-header">
            <div>
                <select class="controls-select" id="globalMonth" onchange="jumpToDate()"></select>
                <select class="controls-select" id="globalYear" onchange="jumpToDate()"></select>
                <button class="controls-button" onclick="jumpToDate()">Ir</button>
            </div>

            <div>
                <button class="controls-button" onclick="changeMonth(-1)">&#9664; Anterior</button>
                <button class="controls-button" onclick="goToToday()">Hoje</button>
                <button class="controls-button" onclick="changeMonth(1)">Próximo &#9654;</button>
            </div>
        </div>

        <div id="puma" class="tab-content">
            <h2 class="puma-header">Tabela Turno PUMA</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Dia</th>
                            <th>A</th>
                            <th>B</th>
                            <th>C</th>
                            <th>D</th>
                            <th>E</th>
                        </tr>
                    </thead>
                    <tbody id="puma-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="monte-alegre" class="tab-content">
            <h2 class="ma-header">Tabela Turno Monte Alegre</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Dia</th>
                            <th>A</th>
                            <th>B</th>
                            <th>C</th>
                            <th>D</th>
                            <th>E</th>
                        </tr>
                    </thead>
                    <tbody id="ma-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="comparar" class="tab-content">

            <h2 class="compare-header">Comparar Escalas</h2>

            <div class="compare-controls" onchange="renderTableCompare()">

                <div class="compare-group">
                    <div class="field-item">
                        <label for="compareTabela1">Tabela 1:</label>
                        <select class="controls-select" id="compareTabela1"></select>
                    </div>
                    <div class="field-item">
                        <label for="compareLetra1">Letra:</label>
                        <select class="controls-select" id="compareLetra1"></select>
                    </div>
                </div>

                <div class="compare-group">
                    <div class="field-item">
                        <label for="compareTabela2">Tabela 2:</label>
                        <select class="controls-select" id="compareTabela2"></select>
                    </div>
                    <div class="field-item">
                        <label for="compareLetra2">Letra:</label>
                        <select class="controls-select" id="compareLetra2"></select>
                    </div>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Dia</th>
                            <th>Fonte 1</th>
                            <th>Fonte 2</th>
                        </tr>
                    </thead>
                    <tbody id="compare-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="container" id="settings-view" style="display: none;">
        <h2 style="background-color: #455A64;">Configurações</h2>

        <div style="padding: 20px; text-align: center;">
            <p style="color: #666; margin-bottom: 20px;">
                Gerenciamento do Aplicativo
            </p>

            <button onclick="hardReset()" class="btn-reset">
                ⚠️ Resetar e Atualizar App
            </button>

            <p style="font-size: 0.8rem; color: #999; margin-top: 30px;">
                Versão 2.0.1
            </p>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('home')">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">Início</span>
        </button>
        <button class="nav-item" onclick="switchView('settings')">
            <span class="nav-icon">⚙️</span>
            <span class="nav-text">Ajustes</span>
        </button>
    </nav>

    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registrado!', reg))
                    .catch((err) => console.log('Falha ao registrar SW:', err));
            });
        }
    </script>
</body>
</html>
