<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas de Turnos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <div class="tab-container">
            <button class="tab-button" onclick="openTab(event, 'puma')">Turno PUMA</button>
            <button class="tab-button" onclick="openTab(event, 'monte-alegre')">Turno Monte Alegre</button>
            <button class="tab-button" onclick="openTab(event, 'comparar')">Comparar</button>
        </div>

        <div class="controls-header">
            <div>
                <select class="select-date" id="globalMonth" onchange="jumpToDate()"></select>
                <select class="select-date" id="globalYear" onchange="jumpToDate()"></select>
                <button class="select-date-button" onclick="jumpToDate()">Ir</button>
            </div>

            <div>
                <button class="select-date-button" onclick="changeMonth(-1)">&#9664; Anterior</button>
                <button class="select-date-button" onclick="goToToday()">Hoje</button>
                <button class="select-date-button" onclick="changeMonth(1)">Próximo &#9654;</button>
            </div>
        </div>

        <div id="puma" class="tab-content">
            <h2 style="background-color: #004D40;">Tabela Turno PUMA</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Dia</th>
                            <th>A</th>
                            <th>B</th>
                            <th>C</th>
                            <th>D</th>
                            <th>E</th>
                        </tr>
                    </thead>
                    <tbody id="puma-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="monte-alegre" class="tab-content">
            <h2 style="background-color: #1B5E20;">Tabela Turno Monte Alegre</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Dia</th>
                            <th>A</th>
                            <th>B</th>
                            <th>C</th>
                            <th>D</th>
                            <th>E</th>
                        </tr>
                    </thead>
                    <tbody id="ma-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="comparar" class="tab-content">
            <h2 style="background-color: #3e2723;">Comparar Escalas</h2>
            <div class="compare-controls">
                <div class="compare-group">
                    <label for="compareTabela1">Fonte 1</label>
                    <select id="compareTabela1"></select>
                    <select id="compareLetra1"></select>
                </div>
                <div class="compare-group">
                    <label for="compareTabela2">Fonte 2</label>
                    <select id="compareTabela2"></select>
                    <select id="compareLetra2"></select>
                </div>
                <button id="compareButton" onclick="renderTableCompare()">Comparar</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Dia</th>
                            <th>Fonte 1</th>
                            <th>Fonte 2</th>
                        </tr>
                    </thead>
                    <tbody id="compare-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
